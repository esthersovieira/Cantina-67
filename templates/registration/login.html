{% extends 'base.html' %}

{% block title %}Login - Cantina Digital{% endblock %}

{% block content %}

<style>

    /* FUNDO */

    .login-wrapper {

        min-height: 75vh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 40px;

        border-radius: 36px;

        background:
            radial-gradient(circle at top left,
                rgba(96,165,250,0.16),
                transparent 30%),

            radial-gradient(circle at bottom right,
                rgba(250,204,21,0.15),
                transparent 30%),

            linear-gradient(
                135deg,
                #f8fbff 0%,
                #f5f3ff 55%,
                #fffdf5 100%
            );
    }

    /* CARD */

    .login-card {

        width: 100%;
        max-width: 420px;

        border: none;

        border-radius: 34px;

        overflow: hidden;

        background:
            rgba(255,255,255,0.78);

        backdrop-filter: blur(18px);

        box-shadow:
            0 25px 60px rgba(0,0,0,0.08);

        transition: 0.3s ease;
    }

    .login-card:hover {
        transform: translateY(-4px);
    }

    /* HEADER */

    .login-header {

        padding: 28px;

        text-align: center;

        background:
            linear-gradient(
                135deg,
                #2563eb,
                #7c3aed
            );

        color: white;

        position: relative;
    }

    .login-header::before {

        content: "";

        position: absolute;

        width: 220px;
        height: 220px;

        top: -100px;
        right: -80px;

        background:
            radial-gradient(circle,
                rgba(255,255,255,0.18),
                transparent 70%);
    }

    .login-icon {

        font-size: 2.4rem;

        margin-bottom: 10px;

        display: inline-block;

        filter: drop-shadow(0 8px 15px rgba(0,0,0,0.25));
    }

    .login-title {

        font-family: 'Fredoka', sans-serif;

        font-size: 1.6rem;

        font-weight: 700;
    }

    /* BODY */

    .login-body {

        padding: 32px;
    }

    /* LABEL */

    .form-label {

        font-weight: 700;

        color: #334155;

        margin-bottom: 8px;
    }

    /* INPUT */

    .form-control {

        border-radius: 18px;

        padding: 14px 16px;

        border: 2px solid transparent;

        background: rgba(255,255,255,0.9);

        transition: 0.3s ease;

        box-shadow:
            inset 0 2px 6px rgba(0,0,0,0.03);
    }

    .form-control:focus {

        border-color: #7c3aed;

        box-shadow:
            0 0 0 5px rgba(124,58,237,0.12);

        transform: translateY(-1px);
    }

    /* BOTÃO */

    .btn-login {

        border: none;

        width: 100%;

        padding: 14px;

        border-radius: 18px;

        font-weight: 800;

        color: #111827;

        background:
            linear-gradient(
                135deg,
                #facc15,
                #fde047
            );

        box-shadow:
            0 15px 30px rgba(250,204,21,0.25);

        transition: 0.3s ease;
    }

    .btn-login:hover {

        transform:
            translateY(-3px)
            scale(1.02);

        box-shadow:
            0 22px 38px rgba(250,204,21,0.38);
    }

    /* ERRO */

    .alert-login {

        border: none;

        border-radius: 16px;

        background: rgba(239,68,68,0.1);

        color: #b91c1c;

        margin-top: 18px;
    }

    /* FOOTER */

    .login-footer {

        text-align: center;

        margin-top: 18px;

        color: #64748b;

        font-size: 0.85rem;
    }

</style>

<div class="login-wrapper">

    <div class="login-card">

        <!-- HEADER -->
        <div class="login-header">

            <div class="login-icon">
                <i class="bi bi-person-lock-fill"></i>
            </div>

            <div class="login-title">
                Acesso ao Sistema
            </div>

        </div>

        <!-- BODY -->
        <div class="login-body">

            <form method="post">

                {% csrf_token %}

                <!-- USER -->
                <div class="mb-3">

                    <label class="form-label">
                        Usuário
                    </label>

                    <input type="text"
                           name="username"
                           class="form-control"
                           placeholder="Digite seu usuário"
                           required>

                </div>

                <!-- PASSWORD -->
                <div class="mb-3">

                    <label class="form-label">
                        Senha
                    </label>

                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Digite sua senha"
                           required>

                </div>

                <!-- BUTTON -->
                <button type="submit"
                        class="btn btn-login mt-3">

                    <i class="bi bi-box-arrow-in-right"></i>
                    Entrar

                </button>

            </form>

            <!-- ERROR -->
            {% if form.errors %}

                <div class="alert alert-login text-center">

                    Usuário ou senha incorretos.

                </div>

            {% endif %}

            <!-- FOOTER -->
            <div class="login-footer">

                © 2026 • Cantina Digital

            </div>

        </div>

    </div>

</div>

{% endblock %}
